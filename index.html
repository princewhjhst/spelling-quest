<div class="actions">
<button class="primary" id="speak">🔊 1. 聽單字發音</button>
<button class="green" id="check">✓ 檢查拼字</button>
<button class="yellow" id="reveal">👀 2. 顯示單字與圖鑑</button>
</div>
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="details" id="details">
<div class="detail-label">單字編號</div><div class="pill" id="number" style="display:inline-block">#1</div>
<h2 id="word">quiet</h2><div class="meaning" id="meaning">安靜的</div>
<img class="picture" id="picture" src="word_icons/1.png" alt="單字代表圖片">
<div class="detail-label">記住圖片與中文意思，再試著拼一次！</div>
</div>
</section>
<section class="nav"><button class="soft" id="prev">← 3. 上一個單字</button><div class="jump"><label for="jumpNum">跳至編號</label><input id="jumpNum" type="number" min="1" max="180" step="1" value="1" aria-label="輸入單字編號"><button class="primary" id="jumpBtn">前往</button></div><button class="soft" id="next">4. 下一個單字 →</button></section>
<section class="panel" style="padding:12px 16px;margin-top:10px">
<div class="actions" style="margin:0"><a class="download" href="拼字大明星_180字_中文翻譯與圖鑑.xlsx" download>⬇ 下載 Excel 單字表</a></div>

</section>
<p class="foot">小提醒：可以先聽發音、輸入拼字並檢查，再顯示中文和圖片。按上一題或下一題可練習全部 180 個單字。</p>

let idx=0, revealed=false;
let practiceMode='sequential', randomOrder=[], randomPos=0, randomRound=1;
const $=id=>document.getElementById(id);
function shuffledOrder(){const a=words.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startRandomRound(){randomOrder=shuffledOrder();randomPos=0;randomRound++;idx=randomOrder[0];revealed=false;render();}
function updateModeUI(){const random=practiceMode==='random';$('roundStatus').hidden=!random;$('restartRandom').hidden=!random;$('jumpNum').disabled=false;$('jumpBtn').disabled=false;}
function updateRandomStatus(){if(practiceMode==='random'){$('roundStatus').textContent=`第 ${randomRound} 輪｜本輪進度 ${randomPos+1} / ${words.length}`;$('bar').style.width=((randomPos+1)/words.length*100)+'%';$('count').textContent=`隨機第 ${randomPos+1} / ${words.length} 題`;$('prev').disabled=randomPos===0;$('prev').style.opacity=randomPos===0?.5:1;$('next').disabled=false;$('next').style.opacity=1;}}
function current(){return words[idx]}
function render(){
 const w=current(); $('count').textContent=`第 ${idx+1} / ${words.length} 題`;
 $('bar').style.width=((idx+1)/words.length*100)+'%';
 $('mask').textContent=revealed?w.word:'_ '.repeat(Math.max(4,w.word.length)).trim();
 $('answer').value=''; $('feedback').textContent=''; $('status').textContent=revealed?'已顯示答案 👀':'練習中 ✏️';
 $('details').classList.toggle('show',revealed);
 $('number').textContent='#'+w.num; $('word').textContent=w.word; $('meaning').textContent=w.zh;
 $('picture').src=w.img; $('picture').alt=w.word+' 的代表圖片';
 $('jumpNum').value=w.num;
 $('prev').disabled=idx===0; $('prev').style.opacity=idx===0?.5:1;
 $('next').disabled=practiceMode==='sequential' && idx===words.length-1; $('next').style.opacity=$('next').disabled?.5:1;
 updateRandomStatus();
}
function speak(){
 const w=current();
 if(!('speechSynthesis' in window)){ $('feedback').textContent='此瀏覽器不支援語音朗讀，請播放下方原始音檔。'; return; }
 speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(w.word); u.lang='en-US';u.rate=getSpeechRate();
 $('feedback').textContent='🔊 正在朗讀單字…'; $('feedback').style.color='#365b80';
 u.onend=()=>{ if($('feedback').textContent==='🔊 正在朗讀單字…') $('feedback').textContent=''; };
 u.onerror=()=>{ if($('feedback').textContent==='🔊 正在朗讀單字…') $('feedback').textContent=''; };
 speechSynthesis.speak(u);
}
function getSpeechRate(){if($('ratePreset').value!=='custom')return Number($('ratePreset').value);const n=Number($('customRate').value);return Number.isFinite(n)&&n>=0.1&&n<=2?n:1;}
function updateCustomRate(){const show=$('ratePreset').value==='custom';$('customRate').hidden=!show;$('customRateLabel').hidden=!show;}
$('ratePreset').onchange=updateCustomRate;
$('customRate').onchange=()=>{const n=Number($('customRate').value);if(!Number.isFinite(n)||n<0.1||n>2){$('customRate').value='1';$('feedback').textContent='自訂速度請輸入 0.1 到 2 倍，已恢復為 1 倍。';$('feedback').style.color='#a54c52';}};
$('speak').onclick=speak;
$('check').onclick=()=>{
 const ans=$('answer').value.trim().toLowerCase(), w=current();
 if(!ans){$('feedback').textContent='先輸入你聽到的英文拼字喔！';return}
 if(ans===w.word.toLowerCase()){ $('feedback').textContent='🎉 答對了！太棒了！'; $('feedback').style.color='#24734f'; $('status').textContent='答對了 🎉'; }
 else {$('feedback').textContent='再試一次！注意字母順序。';$('feedback').style.color='#a54c52';}
};
$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});
$('reveal').onclick=()=>{speechSynthesis.cancel();revealed=!revealed;render();if(revealed)$('feedback').textContent='答案已顯示，記得看圖記意思！'};
$('prev').onclick=()=>{speechSynthesis.cancel();if(practiceMode==='random'){if(randomPos>0){randomPos--;idx=randomOrder[randomPos];revealed=false;render();}}else if(idx>0){idx--;revealed=false;render();}};
$('next').onclick=()=>{speechSynthesis.cancel();if(practiceMode==='random'){if(randomPos<words.length-1){randomPos++;idx=randomOrder[randomPos];revealed=false;render();}else{randomRound++;randomOrder=shuffledOrder();randomPos=0;idx=randomOrder[0];revealed=false;render();$('feedback').textContent=`🎉 第 ${randomRound-1} 輪已完成！開始新一輪隨機練習。`;}}else if(idx<words.length-1){idx++;revealed=false;render();}};
$('practiceMode').onchange=()=>{speechSynthesis.cancel();practiceMode=$('practiceMode').value;revealed=false;if(practiceMode==='random'){randomRound=1;randomOrder=shuffledOrder();randomPos=0;idx=randomOrder[0];}else{idx=0;}updateModeUI();render();};
$('restartRandom').onclick=()=>{speechSynthesis.cancel();randomRound++;randomOrder=shuffledOrder();randomPos=0;idx=randomOrder[0];revealed=false;render();$('feedback').textContent='已開始新一輪隨機練習。'};
function jumpToNumber(){ const n=Number($('jumpNum').value); if(!Number.isInteger(n)||n<1||n>words.length){$('feedback').textContent='請輸入 1 到 180 之間的整數編號。';$('feedback').style.color='#a54c52';return;} speechSynthesis.cancel();idx=n-1;if(practiceMode==='random'){let p=randomOrder.indexOf(idx);if(p<randomPos){randomPos=p;}else if(p>randomPos){randomOrder.splice(p,1);randomOrder.splice(randomPos,0,idx);}idx=randomOrder[randomPos];}revealed=false;render();$('answer').focus(); }
$('jumpBtn').onclick=jumpToNumber;
$('jumpNum').addEventListener('keydown',e=>{if(e.key==='Enter')jumpToNumber()});
updateCustomRate();updateModeUI();render();
</script></body></html>
